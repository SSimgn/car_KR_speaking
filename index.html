<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>말씨와 논리 (올인원 섀도잉)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-active: #1e3a5f;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #facc15;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 120px; min-height: 100vh; }
    
    header { position: sticky; top: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); padding: 10px 0 14px 0; z-index: 50; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
    select { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 0.95rem; }

    /* 재생 모드 토글 바 */
    .toggle-bar { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); }
    .toggle-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .toggle-status { color: var(--accent); font-weight: 700; }
    
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* 전체 리스트 컨테이너 */
    .list-container { display: flex; flex-direction: column; gap: 14px; }
    
    .card { background: var(--card-bg); border: 2px solid transparent; border-radius: 14px; padding: 16px; transition: all 0.25s ease; cursor: pointer; }
    .card.active { border-color: var(--accent); background: var(--card-active); box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .badge.work { background: #0284c7; color: #fff; }
    .badge.daily { background: #059669; color: #fff; }
    .badge.prep { background: #d97706; color: #fff; }
    .card-index { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    .context-label { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 6px; font-weight: 500; }
    .before-text { color: #f87171; font-size: 0.85rem; text-decoration: line-through; margin-bottom: 8px; }
    .main-sentence { font-size: 1.15rem; font-weight: 700; line-height: 1.45; color: #ffffff; }
    .prep-tip { margin-top: 10px; font-size: 0.85rem; color: var(--highlight); line-height: 1.35; border-left: 3px solid var(--highlight); padding-left: 8px; }

    /* 하단 차량 제어 컨트롤러 */
    .controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; z-index: 100; }
    .progress-bar-container { width: 100%; height: 5px; background: #334155; border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; height: 18px; }
    .status-text { color: var(--accent); font-weight: 600; }
    .playing-count { color: var(--text-muted); font-size: 0.8rem; }

    .button-group { display: flex; gap: 10px; }
    button { height: 54px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.1s; }
    .btn-main { background: var(--accent); color: #0f172a; flex: 1.5; }
    .btn-sub { background: #334155; color: var(--text); flex: 0.75; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>말씨와 논리 루틴</h1>
      <select id="daySelector" onchange="changeDay(this.value)"></select>
    </div>
    
    <!-- 재생 모드 토글 (Day 반복 vs 다음 Day 자동 진행) -->
    <div class="toggle-bar">
      <span class="toggle-label">
        종료 후 동작: <span id="modeStatusText" class="toggle-status">현재 Day 반복 재생</span>
      </span>
      <label class="switch">
        <input type="checkbox" id="autoNextToggle" onchange="handleModeToggle(this)">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- 하루치 11개 문장 전체 리스트 -->
  <div class="list-container" id="listContainer"></div>

  <!-- 하단 차량 운전 컨트롤러 -->
  <div class="controls">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-bar">
      <span class="status-text" id="statusLabel">정지됨</span>
      <span class="playing-count" id="playingCount">0 / 11</span>
    </div>
    <div class="button-group">
      <button class="btn-sub" onclick="prevItem()">이전</button>
      <button class="btn-main" id="playBtn" onclick="togglePlay()">전체 재생</button>
      <button class="btn-sub" onclick="nextItem()">다음</button>
    </div>
  </div>

  <audio id="silentAudio" loop playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    const workThemes = [
      ["일정 조율", "무리한 납기 요청 거절", "마감 시점을 이번 주 금요일 오후로 조정하고자 합니다.", "품질 확보 목적 명시"],
      ["의견 대립", "상대 방식의 위험성 지적", "운영 단계의 병목을 줄이기 위해 B안을 병행 검토하는 것이 안전해 보입니다.", "리스크 예방 프레임"],
      ["진행 보고", "중간 과정 모호하게 공유", "현재 공정의 70% 완료되었으며, 내일 정오까지 핵심 지표를 공유드리겠습니다.", "수치와 시점 구체화"],
      ["오류 지적", "동료의 실수 추궁", "최신 사양서 기준과 대조해보니 파라미터 일부에 차이가 있어 재확인 부탁드립니다.", "사람 아닌 기준에 집중"],
      ["자원 요청", "인력 부족 불평", "안정적인 현장 셋업을 위해 사전 검증 단계에 엔지니어 1분의 협조를 요청드립니다.", "필요 자원 명확화"],
      ["회의 주도", "주제 이탈 시 개입", "핵심 의제에 집중하기 위해 부가 논의는 메모해두고 세션 말미에 다루겠습니다.", "논점 회귀 리드"],
      ["협상 방어", "단가 인하 요구 거절", "제안드린 범위 내에서는 현재 수준이 최선이며, 범위 조정 시 단가 재산정이 가능합니다.", "기브앤테이크 조건화"],
      ["상사 피드백", "방향성 혼선 정리", "지시하신 취지를 바탕으로 A안과 B안의 예상 비용을 비교 정리해 결재 올리겠습니다.", "취지 인정 후 대안 제시"],
      ["책임 한계", "담당 외 업무 떠안기", "해당 파트는 설계팀 소관이므로 담당 엔지니어와 즉시 미팅을 주선해 드리겠습니다.", "경계 긋기 및 가교 역할"],
      ["지연 사과", "단순 변명 전달", "검증 중 예상치 못한 변수로 반나절 지연되었습니다. 오늘 18시까지 만회 조치하겠습니다.", "원인과 만회책 동시 제시"]
    ];

    const dailyThemes = [
      ["경계 설정", "가족/지인의 참견 방어", "염려해주시는 마음 잘 알겠습니다. 현재 세운 계획대로 차근차근 진행해보겠습니다."],
      ["약속 거절", "피로 시 거절", "초대해줘서 고마워요. 오늘은 컨디션 조절이 필요해서 다음 주에 제가 먼저 연락할게요."],
      ["감정 표현", "상대의 연락 두절에 화내기", "연락이 오래 닿지 않으면 혹시 무슨 일이 생긴 건 아닌지 걱정이 많이 돼요."],
      ["부탁 거절", "무리한 호의 요청 거절", "도움이 되어 드리고 싶지만, 현재 제가 직접 관여하기 어려운 상황이라 양해를 구합니다."],
      ["식당 요청", "주문 누락 항의", "많이 바쁘신 것 같은데, 저희 주문이 주방에 정상 접수되었는지 확인 한 번 부탁드립니다."],
      ["칭찬 수용", "과도한 자기비하", "좋게 봐주셔서 감사합니다. 팀원들과 함께 준비한 덕분입니다."],
      ["소음 항의", "이웃 간 층간소음 지적", "휴식 시간대에 층간 진동이 다소 전달되고 있어 조금만 신경 써주시면 감사하겠습니다."],
      ["조언 필터링", "불필요한 훈수 넘기기", "그런 관점도 있을 수 있겠네요. 참고하여 신중히 검토해보겠습니다."],
      ["선약 양해", "갑작스러운 모임 불참", "미리 잡힌 일정이 있어 이번엔 참석이 어렵습니다. 좋은 시간 보내세요."],
      ["위로 건네기", "섣부른 해결책 제시 대신", "어떤 마음일지 다 헤아리긴 어렵지만, 곁에서 묵묵히 응원하고 있을게요."]
    ];

    const routineData = [];
    for (let day = 1; day <= 30; day++) {
      const wIdx = (day - 1) % workThemes.length;
      const dIdx = (day - 1) % dailyThemes.length;
      const dayPlan = { day: day, items: [] };

      // 사회생활 5문장
      for (let i = 0; i < 5; i++) {
        const t = workThemes[(wIdx + i) % workThemes.length];
        dayPlan.items.push({
          type: "work",
          badge: "사회생활",
          context: `상황 ${i+1}: ${t[0]} (${t[1]})`,
          before: "투박한 표현: 직설적이거나 방어적인 대화 방식",
          sentence: t[2],
          tip: `PREP 논리: ${t[3]}`
        });
      }

      // 일상생활 5문장
      for (let i = 0; i < 5; i++) {
        const t = dailyThemes[(dIdx + i) % dailyThemes.length];
        dayPlan.items.push({
          type: "daily",
          badge: "일상생활",
          context: `일상 ${i+1}: ${t[0]} (${t[1]})`,
          before: "투박한 표현: 감정적이거나 서운함이 묻어나는 화법",
          sentence: t[2],
          tip: "I-Message: 상대 행동 비난 대신 내 입장과 상태 공유"
        });
      }

      // PREP 1문장
      dayPlan.items.push({
        type: "prep",
        badge: "PREP 실전 발화",
        context: "핵심 의제 설득 (결론-이유-사례-재강조)",
        before: "두서없는 설명: 배경부터 장황하게 말하기",
        sentence: `결론부터 말씀드리면 ${day}차 과제는 시뮬레이션 선검증 후 적용해야 합니다. 사후 수정 비용이 3배 이상 발생하기 때문입니다. 실제로 이전 프로젝트에서도 2주의 일정을 단축했습니다. 따라서 사전 가상 검증부터 착수할 것을 제안합니다.`,
        tip: "Point(결론) -> Reason(이유) -> Example(구체적 수치) -> Point(제안)"
      });

      routineData.push(dayPlan);
    }

    let currentDay = 1;
    let currentIndex = 0;
    let isPlaying = false;
    let isAutoNextDay = false; // 기본값: 현재 Day 반복
    let synth = window.speechSynthesis;
    let timer = null;
    const silentAudio = document.getElementById('silentAudio');
    const listContainer = document.getElementById('listContainer');
    const daySelector = document.getElementById('daySelector');
    const modeStatusText = document.getElementById('modeStatusText');

    // UI 셀렉터 초기화
    routineData.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.day;
      opt.textContent = `Day ${d.day}`;
      daySelector.appendChild(opt);
    });

    // 토글 스위치 변경 핸들러
    function handleModeToggle(checkbox) {
      isAutoNextDay = checkbox.checked;
      if (isAutoNextDay) {
        modeStatusText.innerText = "다음 Day 자동 진행 ➔";
        modeStatusText.style.color = "#38bdf8";
      } else {
        modeStatusText.innerText = "현재 Day 반복 재생 ↺";
        modeStatusText.style.color = "#facc15";
      }
    }

    function renderDayList() {
      listContainer.innerHTML = '';
      const items = routineData[currentDay - 1].items;

      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `card ${idx === currentIndex ? 'active' : ''}`;
        card.id = `card-${idx}`;
        card.onclick = () => selectItem(idx);

        card.innerHTML = `
          <div class="card-top">
            <span class="badge ${item.type}">${item.badge}</span>
            <span class="card-index">#${idx + 1}</span>
          </div>
          <div class="context-label">${item.context}</div>
          <div class="before-text">${item.before}</div>
          <div class="main-sentence">${item.sentence}</div>
          <div class="prep-tip">${item.tip}</div>
        `;
        listContainer.appendChild(card);
      });

      updateUI();
    }

    function selectItem(idx) {
      currentIndex = idx;
      if (isPlaying) {
        if (synth) synth.cancel();
        clearTimeout(timer);
        playCurrentItemStep();
      } else {
        updateUI();
      }
    }

    function updateUI() {
      const items = routineData[currentDay - 1].items;
      
      items.forEach((_, idx) => {
        const c = document.getElementById(`card-${idx}`);
        if (c) {
          if (idx === currentIndex) {
            c.classList.add('active');
            c.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            c.classList.remove('active');
          }
        }
      });

      document.getElementById('playingCount').innerText = `${currentIndex + 1} / ${items.length}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / items.length) * 100}%`;
      setupMediaSession();
    }

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;

      const item = routineData[currentDay - 1].items[currentIndex];
      const total = routineData[currentDay - 1].items.length;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.sentence,
        artist: `[${item.badge}] ${item.context}`,
        album: `말씨와 논리 Day ${currentDay} (${currentIndex + 1}/${total})`,
        artwork: [
          { src: 'https://placehold.co/512x512/0f172a/38bdf8.png?text=Voice+Shadowing', sizes: '512x512', type: 'image/png' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', startRoutine);
      navigator.mediaSession.setActionHandler('pause', stopRoutine);
      navigator.mediaSession.setActionHandler('previoustrack', prevItem);
      navigator.mediaSession.setActionHandler('nexttrack', nextItem);
    }

    function changeDay(day) {
      stopRoutine();
      currentDay = parseInt(day);
      daySelector.value = currentDay;
      currentIndex = 0;
      renderDayList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function togglePlay() {
      if (isPlaying) {
        stopRoutine();
      } else {
        startRoutine();
      }
    }

    function startRoutine() {
      isPlaying = true;
      document.getElementById('playBtn').innerText = "일시 정지";
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
      silentAudio.play().catch(() => {});
      playCurrentItemStep();
    }

    function stopRoutine() {
      isPlaying = false;
      if (synth) synth.cancel();
      clearTimeout(timer);
      silentAudio.pause();
      document.getElementById('playBtn').innerText = "전체 재생";
      document.getElementById('statusLabel').innerText = "정지됨";
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
    }

    function playCurrentItemStep() {
      if (!isPlaying) return;

      const items = routineData[currentDay - 1].items;

      // 11개 문장이 모두 끝났을 때의 분기 처리
      if (currentIndex >= items.length) {
        if (isAutoNextDay) {
          // [다음 Day 자동 진행] 모드
          currentDay = (currentDay < 30) ? currentDay + 1 : 1;
          daySelector.value = currentDay;
          currentIndex = 0;
          renderDayList();
          document.getElementById('statusLabel').innerText = `Day ${currentDay}로 이동하여 재생합니다.`;
          timer = setTimeout(playCurrentItemStep, 1500);
          return;
        } else {
          // [현재 Day 반복] 모드
          currentIndex = 0;
          document.getElementById('statusLabel').innerText = `Day ${currentDay} 처음부터 다시 반복합니다.`;
          timer = setTimeout(playCurrentItemStep, 1500);
          return;
        }
      }

      updateUI();
      const item = items[currentIndex];

      // 1. 상황 안내
      document.getElementById('statusLabel').innerText = "1. 상황 듣기";
      speak(item.context, 1.0, () => {
        if (!isPlaying) return;

        // 2. 핵심 추천 표현
        document.getElementById('statusLabel').innerText = "2. 표현 듣기";
        speak(item.sentence, 0.9, () => {
          if (!isPlaying) return;

          // 3. 섀도잉 발화 대기 (4초)
          document.getElementById('statusLabel').innerText = "3. 따라 말하세요 (4초)";
          timer = setTimeout(() => {
            if (!isPlaying) return;

            // 4. 논리 팁 청취
            document.getElementById('statusLabel').innerText = "4. 논리 팁 청취";
            speak(item.tip, 1.0, () => {
              if (!isPlaying) return;
              currentIndex++;
              timer = setTimeout(playCurrentItemStep, 1000);
            });
          }, 4000);
        });
      });
    }

    function speak(text, rate, onEndCallback) {
      if (!synth) return;
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = rate || 1.0;
      utter.pitch = 1.0;
      utter.onend = () => { if (onEndCallback) onEndCallback(); };
      utter.onerror = () => { if (onEndCallback) onEndCallback(); };
      synth.speak(utter);
    }

    function nextItem() {
      const items = routineData[currentDay - 1].items;
      if (currentIndex < items.length - 1) {
        currentIndex++;
      } else {
        if (isAutoNextDay) {
          currentDay = (currentDay < 30) ? currentDay + 1 : 1;
          daySelector.value = currentDay;
          currentIndex = 0;
          renderDayList();
        } else {
          currentIndex = 0;
        }
      }

      if (isPlaying) {
        synth.cancel();
        clearTimeout(timer);
        playCurrentItemStep();
      } else {
        updateUI();
      }
    }

    function prevItem() {
      const items = routineData[currentDay - 1].items;
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = items.length - 1;
      }

      if (isPlaying) {
        synth.cancel();
        clearTimeout(timer);
        playCurrentItemStep();
      } else {
        updateUI();
      }
    }

    // 초기 렌더링
    renderDayList();
  </script>
</body>
</html>
