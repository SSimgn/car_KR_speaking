<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>말씨와 논리 (배경 & 대화형 섀도잉)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-active: #1e3a5f;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #facc15;
      --dialogue-bg: #0b1329;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 120px; min-height: 100vh; }
    
    header { position: sticky; top: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); padding: 10px 0 14px 0; z-index: 50; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
    select { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 0.95rem; }

    /* 재생 모드 토글 바 */
    .toggle-bar { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); }
    .toggle-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .toggle-status { color: var(--highlight); font-weight: 700; }
    
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* 리스트 컨테이너 */
    .list-container { display: flex; flex-direction: column; gap: 16px; }
    
    .card { background: var(--card-bg); border: 2px solid transparent; border-radius: 14px; padding: 16px; transition: all 0.25s ease; cursor: pointer; }
    .card.active { border-color: var(--accent); background: var(--card-active); box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
    .badge.work { background: #0284c7; color: #fff; }
    .badge.daily { background: #059669; color: #fff; }
    .badge.prep { background: #d97706; color: #fff; }
    .card-index { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    .context-label { color: var(--accent); font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
    .background-desc { font-size: 0.85rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 8px 10px; border-radius: 6px; }

    /* 다이얼로그 대화창 UI */
    .dialogue-box { background: var(--dialogue-bg); border: 1px solid #1e293b; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 0.88rem; line-height: 1.5; }
    .dialogue-line { margin-bottom: 4px; display: flex; gap: 6px; }
    .dialogue-line:last-child { margin-bottom: 0; }
    .speaker-other { color: #f87171; font-weight: 700; flex-shrink: 0; }
    .speaker-me { color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .speech-bubble { color: #e2e8f0; }

    .main-section { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 6px; }
    .main-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .main-sentence { font-size: 1.15rem; font-weight: 700; line-height: 1.45; color: #ffffff; }
    .prep-tip { margin-top: 10px; font-size: 0.85rem; color: var(--highlight); line-height: 1.35; border-left: 3px solid var(--highlight); padding-left: 8px; }

    /* 하단 차량 제어 컨트롤러 */
    .controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; z-index: 100; }
    .progress-bar-container { width: 100%; height: 5px; background: #334155; border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; height: 18px; }
    .status-text { color: var(--accent); font-weight: 600; }
    .playing-count { color: var(--text-muted); font-size: 0.8rem; }

    .button-group { display: flex; gap: 10px; }
    button { height: 54px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.1s; }
    .btn-main { background: var(--accent); color: #0f172a; flex: 1.5; }
    .btn-sub { background: #334155; color: var(--text); flex: 0.75; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>말씨와 논리 루틴</h1>
      <select id="daySelector" onchange="changeDay(this.value)"></select>
    </div>
    
    <div class="toggle-bar">
      <span class="toggle-label">
        종료 후: <span id="modeStatusText" class="toggle-status">현재 Day 반복 재생 ↺</span>
      </span>
      <label class="switch">
        <input type="checkbox" id="autoNextToggle" onchange="handleModeToggle(this)">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <div class="list-container" id="listContainer"></div>

  <div class="controls">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-bar">
      <span class="status-text" id="statusLabel">정지됨</span>
      <span class="playing-count" id="playingCount">0 / 11</span>
    </div>
    <div class="button-group">
      <button class="btn-sub" onclick="prevItem()">이전</button>
      <button class="btn-main" id="playBtn" onclick="togglePlay()">전체 재생</button>
      <button class="btn-sub" onclick="nextItem()">다음</button>
    </div>
  </div>

  <audio id="silentAudio" loop playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

        bg: "칭찬에 지나치게 손사래를 치며 자학하는 것은 겸손이 아닙니다. 감사히 받고 팀이나 협력자에게 공을 돌릴 때 가장 성숙해 보입니다.",
        otherText: "이번 발표 정말 완벽했어요. 완전 핵심 인재시네요!",
        myText: "좋게 봐주셔서 감사합니다. 팀원들이 데이터를 꼼꼼히 챙겨준 덕분입니다.",
        tip: "감사 표현 + 협력자에게 공 돌리기."
      },
      {
        theme: "소음/불편 항의",
        bg: "이웃 간 감정싸움은 '당신 때문에 피해를 보고 있다'는 공격성에서 시작됩니다. 현상 자체(진동 전달)만 객관적으로 알리고 배려를 구합니다.",
        otherText: "(밤늦게 위층에서 쿵쾅거리는 소음이 지속되는 상황)",
        myText: "휴식 시간대에 층간 진동이 다소 전달되고 있어, 조금만 신경 써주시면 감사하겠습니다.",
        tip: "상대의 고의성을 탓하지 않고 전달 현상만 조용히 알립니다."
      },
      {
        theme: "불필요한 훈수 넘기기",
        bg: "지나가는 참견에 일일이 반박하면 논쟁만 길어집니다. 맞서 싸우지 않고 '하나의 의견으로 듣겠다'며 가볍게 흘려보냅니다.",
        otherText: "요즘 차는 그렇게 관리하면 안 돼. 내 말 듣고 이렇게 바꿔봐.",
        myText: "그런 관점도 있을 수 있겠네요. 참고하여 신중히 검토해보겠습니다.",
        tip: "동의가 아닌 '인지'만 하고 넘어가는 화법."
      },
      {
        theme: "선약 양해 구하기",
        bg: "갑작스러운 불참 통보는 상세한 핑계를 댈수록 변명처럼 느껴집니다. 선약이 있음을 담백하게 알리고 모임의 즐거움을 빌어주는 것이 정석입니다.",
        otherText: "이번 주말 동기 모임 다 모이기로 했는데 올 수 있지?",
        myText: "미리 잡힌 선약이 있어 이번엔 참석이 어렵습니다. 다들 좋은 시간 보내세요.",
        tip: "장황한 사유 배제 + 단호한 선약 언급 + 따뜻한 덕담."
      },
      {
        theme: "위로 건네기",
        bg: "힘든 일을 겪은 사람에게 섣부른 조언이나 해결책 제시는 2차 상처가 됩니다. 감히 다 알 수 없다는 겸손과 묵묵한 지지가 최고의 위로입니다.",
        otherText: "나 이번에 준비하던 거 다 무산됐어... 진짜 막막하다.",
        myText: "어떤 마음일지 다 헤아리긴 어렵지만, 곁에서 묵묵히 응원하고 있을게요.",
        tip: "섣부른 해결책 평가 금지 + 존재 자체로서의 지지 표명."
      }
    ];

    // 30일치 데이터 동적 빌드
    const routineData = [];
    for (let day = 1; day <= 30; day++) {
      const wIdx = (day - 1) % workThemes.length;
      const dIdx = (day - 1) % dailyThemes.length;
      const dayPlan = { day: day, items: [] };

      // 사회생활 5문장
      for (let i = 0; i < 5; i++) {
        const t = workThemes[(wIdx + i) % workThemes.length];
        dayPlan.items.push({
          type: "work",
          badge: "사회생활",
          theme: `상황 ${i+1}: ${t.theme}`,
          bg: t.bg,
          other: t.otherText,
          sentence: t.myText,
          tip: t.tip
        });
      }

      // 일상생활 5문장
      for (let i = 0; i < 5; i++) {
        const t = dailyThemes[(dIdx + i) % dailyThemes.length];
        dayPlan.items.push({
          type: "daily",
          badge: "일상생활",
          theme: `일상 ${i+1}: ${t.theme}`,
          bg: t.bg,
          other: t.otherText,
          sentence: t.myText,
          tip: t.tip
        });
      }

      // PREP 종합 발화 1문장
      dayPlan.items.push({
        type: "prep",
        badge: "PREP 실전 발화",
        theme: `핵심 의제 설득 (Day ${day})`,
        bg: "장황한 서론 대신 결론부터 제시하고 구체적인 수치로 입증하는 비즈니스 논리 구조입니다.",
        other: "팀장: 다음 분기 장비 검증 방식에 대해 각자 의견 간략히 내보세요.",
        sentence: `결론부터 말씀드리면 ${day}차 과제는 시뮬레이션 선검증 후 현장 적용해야 합니다. 사후 수정 비용이 3배 이상 발생하기 때문입니다. 실제로 이전 현장에서도 2주의 일정을 단축했습니다. 따라서 사전 가상 검증부터 착수할 것을 제안합니다.`,
        tip: "Point(결론) -> Reason(이유) -> Example(구체적 수치) -> Point(제안)"
      });

      routineData.push(dayPlan);
    }

    let currentDay = 1;
    let currentIndex = 0;
    let isPlaying = false;
    let isAutoNextDay = false;
    let synth = window.speechSynthesis;
    let timer = null;
    const silentAudio = document.getElementById('silentAudio');
    const listContainer = document.getElementById('listContainer');
    const daySelector = document.getElementById('daySelector');
    const modeStatusText = document.getElementById('modeStatusText');

    routineData.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.day;
      opt.textContent = `Day ${d.day}`;
      daySelector.appendChild(opt);
    });

    function handleModeToggle(checkbox) {
      isAutoNextDay = checkbox.checked;
      if (isAutoNextDay) {
        modeStatusText.innerText = "다음 Day 자동 진행 ➔";
        modeStatusText.style.color = "#38bdf8";
      } else {
        modeStatusText.innerText = "현재 Day 반복 재생 ↺";
        modeStatusText.style.color = "#facc15";
      }
    }

    function renderDayList() {
      listContainer.innerHTML = '';
      const items = routineData[currentDay - 1].items;

      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `card ${idx === currentIndex ? 'active' : ''}`;
        card.id = `card-${idx}`;
        card.onclick = () => selectItem(idx);

        card.innerHTML = `
          <div class="card-top">
            <span class="badge ${item.type}">${item.badge}</span>
            <span class="card-index">#${idx + 1}</span>
          </div>
          <div class="context-label">${item.theme}</div>
          <div class="background-desc">💡 ${item.bg}</div>
          
          <div class="dialogue-box">
            <div class="dialogue-line">
              <span class="speaker-other">상대:</span>
              <span class="speech-bubble">"${item.other}"</span>
            </div>
            <div class="dialogue-line">
              <span class="speaker-me">나:</span>
              <span class="speech-bubble"><b>"${item.sentence}"</b></span>
            </div>
          </div>

          <div class="prep-tip">${item.tip}</div>
        `;
        listContainer.appendChild(card);
      });

      updateUI();
    }

    function selectItem(idx) {
      currentIndex = idx;
      if (isPlaying) {
        if (synth) synth.cancel();
        clearTimeout(timer);
        playCurrentItemStep();
      } else {
        updateUI();
      }
    }

    function updateUI() {
      const items = routineData[currentDay - 1].items;
      
      items.forEach((_, idx) => {
        const c = document.getElementById(`card-${idx}`);
        if (c) {
          if (idx === currentIndex) {
            c.classList.add('active');
            c.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            c.classList.remove('active');
          }
        }
      });

      document.getElementById('playingCount').innerText = `${currentIndex + 1} / ${items.length}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / items.length) * 100}%`;
      setupMediaSession();
    }

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;

      const item = routineData[currentDay - 1].items[currentIndex];
      const total = routineData[currentDay - 1].items.length;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.sentence,
        artist: `[${item.badge}] ${item.theme}`,
        album: `말씨와 논리 Day ${currentDay} (${currentIndex + 1}/${total})`,
        artwork: [
          { src: 'https://placehold.co/512x512/0f172a/38bdf8.png?text=Voice+Shadowing', sizes: '512x512', type: 'image/png' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', startRoutine);
      navigator.mediaSession.setActionHandler('pause', stopRoutine);
      navigator.mediaSession.setActionHandler('previoustrack', prevItem);
      navigator.mediaSession.setActionHandler('nexttrack', nextItem);
    }

    function changeDay(day) {
      stopRoutine();
      currentDay = parseInt(day);
      daySelector.value = currentDay;
      currentIndex = 0;
      renderDayList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function togglePlay() {
      if (isPlaying) {
        stopRoutine();
      } else {
        startRoutine();
      }
    }

    function startRoutine() {
      isPlaying = true;
      document.getElementById('playBtn').innerText = "일시 정지";
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
      silentAudio.play().catch(() => {});
      playCurrentItemStep();
    }

    function stopRoutine() {
      isPlaying = false;
      if (synth) synth.cancel();
      clearTimeout(timer);
      silentAudio.pause();
      document.getElementById('playBtn').innerText = "전체 재생";
      document.getElementById('statusLabel').innerText = "정지됨";
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
    }

    // 운전 중 청취 루틴: 상황 -> 상대 말 -> 내 답변 -> 4초 섀도잉 발화 -> 논리 팁
    function playCurrentItemStep() {
      if (!isPlaying) return;

      const items = routineData[currentDay - 1].items;

      if (currentIndex >= items.length) {
        if (isAutoNextDay) {
          currentDay = (currentDay < 30) ? currentDay + 1 : 1;
          daySelector.value = currentDay;
          currentIndex = 0;
          renderDayList();
          document.getElementById('statusLabel').innerText = `Day ${currentDay}로 이동합니다.`;
          timer = setTimeout(playCurrentItemStep, 1500);
          return;
        } else {
          currentIndex = 0;
          document.getElementById('statusLabel').innerText = `Day ${currentDay} 다시 반복합니다.`;
          timer = setTimeout(playCurrentItemStep, 1500);
          return;
        }
      }

      updateUI();
      const item = items[currentIndex];

      // 1. 상황 안내
      document.getElementById('statusLabel').innerText = "1. 상황 및 상대방 발언";
      speak(`${item.theme}. 상대방의 말. ${item.other}`, 1.0, () => {
        if (!isPlaying) return;

        // 2. 나의 세련된 답변 청취
        document.getElementById('statusLabel').innerText = "2. 나의 답변 듣기";
        speak(item.sentence, 0.9, () => {
          if (!isPlaying) return;

          // 3. 운전자 직접 발화 (4초 섀도잉 무음 대기)
          document.getElementById('statusLabel').innerText = "3. 소리 내어 따라 말하세요 (4초)";
          timer = setTimeout(() => {
            if (!isPlaying) return;

            // 4. 논리 팁 청취 후 다음으로 이동
            document.getElementById('statusLabel').innerText = "4. 논리 팁 청취";
            speak(item.tip, 1.0, () => {
              if (!isPlaying) return;
              currentIndex++;
              timer = setTimeout(playCurrentItemStep, 1000);
            });
          }, 4000);
        });
      });
    }

    function speak(text, rate, onEndCallback) {
      if (!synth) return;
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = rate || 1.0;
      utter.pitch = 1.0;
      utter.onend = () => { if (onEndCallback) onEndCallback(); };
      utter.onerror = () => { if (onEndCallback) onEndCallback(); };
      synth.speak(utter);
    }

    function nextItem() {
      const items = routineData[currentDay - 1].items;
      if (currentIndex < items.length - 1) {
        currentIndex++;
      } else {
        if (isAutoNextDay) {
          currentDay = (currentDay < 30) ? currentDay + 1 : 1;
          daySelector.value = currentDay;
          currentIndex = 0;
          renderDayList();
        } else {
          currentIndex = 0;
        }
      }

      if (isPlaying) {
        synth.cancel();
        clearTimeout(timer);
        playCurrentItemStep();
      } else {
        updateUI();
      }
    }

    function prevItem() {
      const items = routineData[currentDay - 1].items;
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = items.length - 1;
      }

      if (isPlaying) {
        synth.cancel();
        clearTimeout(timer);
        playCurrentItemStep();
      } else {
        updateUI();
      }
    }

    renderDayList();
  </script>
</body>
</html>
